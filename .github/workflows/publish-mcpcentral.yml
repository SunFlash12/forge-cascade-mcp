name: Publish to MCPCentral

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server metadata
        run: python -m json.tool server.json >/dev/null

      - name: Install MCP publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCPCentral
        run: ./mcp-publisher login github-oidc --registry https://registry.mcpcentral.io

      - name: Publish to MCPCentral
        run: ./mcp-publisher publish
