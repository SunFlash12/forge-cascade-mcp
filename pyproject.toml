[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-cascade-mcp"
version = "0.1.7"
description = "Public MCP connector for Forge Cascade enterprise AI memory buyer routing, paid route recommendations, and direct checkout routes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Forge Cascade" }]
keywords = ["mcp", "model-context-protocol", "ai-memory", "rag", "enterprise-ai", "agentic-commerce", "stripe-checkout", "private-rag", "knowledge-graph", "prompt-injection-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=1.2.0"
]

[project.urls]
Homepage = "https://forgecascade.org/buy"
Documentation = "https://forgecascade.org/docs/agents"
Manifest = "https://forgecascade.org/.well-known/mcp.json"
OpenAPI = "https://forgecascade.org/openapi.json"
Pricing = "https://forgecascade.org/pricing"
Enterprise = "https://forgecascade.org/enterprise"

[project.scripts]
forge-cascade-mcp = "forge_cascade_mcp.server:main"
