[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-cascade-mcp"
version = "0.1.7"
description = "Public MCP connector for Forge Cascade enterprise AI memory buyer routing, paid route recommendations, and direct checkout routes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Forge Cascade" }]
keywords = ["mcp", "model-context-protocol", "ai-memory", "rag", "enterprise-ai", "agentic-commerce", "stripe-checkout", "private-rag", "knowledge-graph", "prompt-injection-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=1.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://froggit.ai/buy"
Documentation = "https://froggit.ai/docs/agents"
Manifest = "https://froggit.ai/.well-known/mcp.json"
OpenAPI = "https://froggit.ai/openapi.json"
Pricing = "https://froggit.ai/pricing"
Enterprise = "https://froggit.ai/enterprise"

[project.scripts]
forge-cascade-mcp = "forge_cascade_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
