[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-cascade-mcp"
version = "0.1.3"
description = "Public MCP connector for Forge Cascade enterprise AI memory buyer routes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Forge Cascade" }]
keywords = ["mcp", "model-context-protocol", "ai-memory", "rag", "enterprise-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=1.2.0"
]

[project.urls]
Homepage = "https://sunflash12.github.io/ForgeV3/mcp-agent-memory.html"
Documentation = "https://sunflash12.github.io/ForgeV3/mcp.html"
Manifest = "https://sunflash12.github.io/ForgeV3/.well-known/mcp.json"
OpenAPI = "https://sunflash12.github.io/ForgeV3/openapi.json"
Pricing = "https://sunflash12.github.io/ForgeV3/pricing.html"
Enterprise = "https://sunflash12.github.io/ForgeV3/enterprise.html"

[project.scripts]
forge-cascade-mcp = "forge_cascade_mcp.server:main"
